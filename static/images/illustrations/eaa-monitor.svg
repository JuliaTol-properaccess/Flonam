<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" role="img" aria-label="EAA-monitor toegankelijkheidscontrole mockup">
  <!-- Soft background blobs -->
  <ellipse cx="240" cy="380" rx="200" ry="14" fill="#1F2A37" opacity="0.08"/>
  <ellipse cx="100" cy="90" rx="120" ry="120" fill="#FDC500" opacity="0.10"/>

  <!-- Browser window -->
  <g transform="translate(50 40)">
    <rect width="380" height="260" rx="14" fill="#FFFFFF" stroke="#E3DFD6" stroke-width="1.5"/>
    <!-- Browser chrome -->
    <rect width="380" height="34" rx="14" fill="#F6F4EF"/>
    <rect y="20" width="380" height="14" fill="#F6F4EF"/>
    <circle cx="20" cy="17" r="4" fill="#DA251D"/>
    <circle cx="34" cy="17" r="4" fill="#FDC500"/>
    <circle cx="48" cy="17" r="4" fill="#006AA7"/>
    <rect x="70" y="10" width="220" height="14" rx="7" fill="#FFFFFF" stroke="#E3DFD6" stroke-width="1"/>
    <text x="82" y="20" font-family="Inter, sans-serif" font-size="8" fill="#67625A">jouwsite.nl</text>

    <!-- Page content skeleton -->
    <rect x="24" y="56" width="150" height="12" rx="3" fill="#1F2A37"/>
    <rect x="24" y="76" width="220" height="6" rx="2" fill="#E3DFD6"/>
    <rect x="24" y="88" width="180" height="6" rx="2" fill="#E3DFD6"/>
    <rect x="24" y="110" width="100" height="34" rx="6" fill="#EAF2F7"/>
    <rect x="134" y="110" width="100" height="34" rx="6" fill="#F6F4EF"/>
    <rect x="24" y="156" width="332" height="6" rx="2" fill="#E3DFD6"/>
    <rect x="24" y="168" width="260" height="6" rx="2" fill="#E3DFD6"/>
    <rect x="24" y="190" width="90" height="24" rx="12" fill="#1F2A37"/>
  </g>

  <!-- Findings panel -->
  <g transform="translate(150 250)">
    <rect width="230" height="130" rx="12" fill="#FFFFFF" stroke="#E3DFD6" stroke-width="1.5"/>
    <text x="16" y="26" font-family="Manrope, sans-serif" font-size="11" font-weight="800" fill="#1F2A37">EAA-monitor.nl</text>
    <text x="16" y="40" font-family="Inter, sans-serif" font-size="8" fill="#67625A">Laatste controle: vandaag</text>
    <line x1="16" y1="50" x2="214" y2="50" stroke="#E3DFD6" stroke-width="1"/>

    <!-- Check: pass -->
    <circle cx="24" cy="66" r="8" fill="#EAF2F7"/>
    <path d="M 20 66 L 23 69 L 29 62" stroke="#006AA7" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="62" width="150" height="6" rx="2" fill="#E3DFD6"/>

    <!-- Check: pass -->
    <circle cx="24" cy="88" r="8" fill="#EAF2F7"/>
    <path d="M 20 88 L 23 91 L 29 84" stroke="#006AA7" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="84" width="120" height="6" rx="2" fill="#E3DFD6"/>

    <!-- Check: ontbreekt -->
    <circle cx="24" cy="110" r="8" fill="#FFF3C4"/>
    <path d="M 24 105 L 24 111 M 24 114 L 24 114.5" stroke="#DA251D" stroke-width="2" stroke-linecap="round"/>
    <rect x="40" y="106" width="100" height="6" rx="2" fill="#E3DFD6"/>
  </g>
</svg>
