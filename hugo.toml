baseURL = "https://flonam.nl/"
title = "Flonam"
locale = "nl"
defaultContentLanguage = "nl"
defaultContentLanguageInSubdir = false
timeZone = "Europe/Amsterdam"
disableKinds = ["taxonomy", "term", "rss"]

[languages]
  [languages.nl]
    label = "Nederlands"
    locale = "nl"
    weight = 1
    contentDir = "content/nl"
    [languages.nl.params]
      description = "Wij bouwen datagedreven SaaS-oplossingen voor bedrijven en organisaties."
    [[languages.nl.menus.main]]
      identifier = "home"
      name = "Home"
      url = "/"
      weight = 1
    [[languages.nl.menus.main]]
      identifier = "over"
      name = "Over ons"
      url = "/over/"
      weight = 4
    [[languages.nl.menus.main]]
      identifier = "producten"
      name = "Producten"
      url = "/producten/"
      weight = 2
    [[languages.nl.menus.main]]
      identifier = "workshops"
      name = "Workshops"
      url = "/workshops/"
      weight = 3
    [[languages.nl.menus.main]]
      identifier = "contact"
      name = "Contact"
      url = "/contact/"
      weight = 5
  [languages.en]
    label = "English"
    locale = "en"
    weight = 2
    contentDir = "content/en"
    [languages.en.params]
      description = "We build data-driven SaaS solutions for businesses and organisations."
    [[languages.en.menus.main]]
      identifier = "home"
      name = "Home"
      url = "/en/"
      weight = 1
    [[languages.en.menus.main]]
      identifier = "over"
      name = "About us"
      url = "/en/about/"
      weight = 3
    [[languages.en.menus.main]]
      identifier = "producten"
      name = "Products"
      url = "/en/products/"
      weight = 2
    [[languages.en.menus.main]]
      identifier = "contact"
      name = "Contact"
      url = "/en/contact/"
      weight = 4

[pagination]
  pagerSize = 12

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

# Zoekindex voor het ⌘K-palet: /search.json en /en/search.json
[outputFormats]
  [outputFormats.searchindex]
    mediaType = "application/json"
    baseName = "search"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["html", "searchindex"]

[params]
  author = "Flonam"
  logoText = "Flonam"

  [params.contact]
    email = "info@flonam.nl"
    address = "Randweg 25, 8304 AS Emmeloord"
    kvk = "42103028"
    # Contact- en aanmeldformulier gaan via FormSubmit naar info@flonam.nl (geen account nodig).
    # De eerste inzending stuurt een activatiemail naar dat adres; pas na die klik komen berichten door.
    # Leeg = het formulier valt terug op het mailprogramma van de bezoeker (mailto).
    formEndpoint = "https://formsubmit.co/ajax/info@flonam.nl"

[sitemap]
  changefreq = "monthly"
  filename = "sitemap.xml"
  priority = 0.5
