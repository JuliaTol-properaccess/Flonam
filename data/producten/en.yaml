# Products — used on Home ("What's running"), Products, in the footer, the home terminal and the ⌘K palette.
# Measured values (uptime, P95, percentages …) live separately in data/metrics.yaml.
items:
  - id: "eaa-monitor"
    title: "EAA-monitor.nl"
    kind: "DASHBOARD"
    url: "https://eaa-monitor.nl"
    summary: "Measured weekly and independently: how is the Netherlands doing with the accessibility act? In plain language, per sector."
    intro: "Tracks, sector by sector, where the Netherlands stands on the accessibility act. Who the law applies to, what regulators check, and what you can do yourself."
    features:
      - "Weekly, independent measurement per sector"
      - "Explained in plain language, no legal jargon"
      - "No sales pitch"
    cta: "Go to EAA-monitor.nl"
    meta:
      - { k: "last_run", metric: "last_run" }
      - { k: "sectors", v: "5" }
      - { k: "uptime", metric: "uptime" }
    panel: "screenshot"
    panel_title: "eaa-monitor.nl"
    screenshot: "/images/screenshots/eaa-monitor-hero.png"
    screenshot_w: 1410
    screenshot_h: 858
    screenshot_alt: "Screenshot of EAA-monitor.nl"
    # Alternatief: panel: "chart" + panel_title: "measurement_per_sector.csv" toont de sectorgrafiek (cijfers uit data/metrics.yaml).
    sectors:
      - { id: "rijksoverheid", name: "Central gov." }
      - { id: "gemeenten", name: "Municipalities" }
      - { id: "cultuur", name: "Culture" }
      - { id: "e-commerce", name: "E-commerce" }
      - { id: "zorg", name: "Healthcare" }
    palette:
      title: "Does the accessibility act apply to me?"
      keywords: "eaa wcag accessibility act law european toegankelijkheid"
  - id: "mkb-offerte"
    title: "MKB-offerte.nl"
    kind: "TOOL"
    url: "https://mkb-offerte.nl"
    summary: "Paste in your client's request. Within ten minutes there's a quote ready that your client signs online."
    intro: "Create and follow up on quotes without an evening chore. Paste in the request, and within ten minutes you have a proposal your client can sign online right away."
    features:
      - "Quote ready in 10 minutes, even from your phone"
      - "Client signs directly in the browser"
      - "WCAG 2.2 AA — also usable with a disability"
    cta: "Go to MKB-offerte.nl"
    meta:
      - { k: "avg_time", metric: "avg_time" }
      - { k: "e-sign", v: "yes" }
      - { k: "wcag", v: "2.2 AA" }
    panel: "screenshot"
    panel_title: "mkb-offerte.nl/app"
    screenshot: "/images/screenshots/mkb-offerte-hero.png"
    screenshot_w: 1425
    screenshot_h: 875
    screenshot_alt: "Screenshot of MKB-offerte.nl"
    palette:
      title: "Create a quote and get it signed"
      keywords: "quote proposal sign signature client offerte"

