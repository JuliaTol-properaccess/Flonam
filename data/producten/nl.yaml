title: "Waar we nu aan bouwen"
body: "Twee producten live, meer op komst. Elk met een eigen site."
items:
  - title: "EAA-monitor.nl"
    screenshot: "eaa-monitor"
    intro: "Sinds juni 2025 moeten veel digitale diensten toegankelijk zijn. EAA-monitor.nl houdt per sector bij hoe Nederland ervoor staat, en legt in gewone taal uit voor wie de wet geldt, wat toezichthouders controleren en wat je zelf kunt doen."
    features:
      - "Wekelijkse, onafhankelijke meting per sector"
      - "Uitleg in gewone taal, geen juridisch jargon"
      - "Gratis te raadplegen, zonder verkooppraatje"
    url: "https://eaa-monitor.nl"
  - title: "MKB-offerte.nl"
    screenshot: "mkb-offerte"
    intro: "Offertes maken en opvolgen zonder dat het een avondklus wordt. Plak de aanvraag van je klant erin en binnen tien minuten staat er een offerte klaar die je klant direct online kan ondertekenen."
    features:
      - "Offerte in 10 minuten, ook vanaf je telefoon"
      - "Klant ondertekent direct in de browser"
      - "WCAG 2.2 AA-proof — ook toegankelijk voor gebruikers met een beperking"
    url: "https://mkb-offerte.nl"
