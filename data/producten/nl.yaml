    tag: "DASHBOARD · LIVE"
    color: "#0A8FD8"
    kind: "dashboard"
    statusLine: "wekelijkse meting per sector"
    intro: "Houdt per sector bij hoe Nederland ervoor staat met de toegankelijkheidswet. In gewone taal: voor wie de wet geldt, waar toezichthouders op letten en wat je zelf kunt doen."
