# Producten — gebruikt op Home ("Wat er draait"), Producten, in de footer, de home-terminal en het ⌘K-palet.
# Meetwaarden (uptime, P95, percentages …) staan los in data/metrics.yaml.
items:
  - id: "eaa-monitor"
    title: "EAA-monitor.nl"
    kind: "DASHBOARD"
    url: "https://eaa-monitor.nl"
    summary: "Wekelijks, onafhankelijk gemeten: hoe staat Nederland ervoor met de toegankelijkheidswet? In gewone taal, per sector."
    intro: "Houdt per sector bij hoe Nederland ervoor staat met de toegankelijkheidswet. Voor wie de wet geldt, waar toezichthouders op letten en wat je zelf kunt doen."
    features:
      - "Wekelijkse, onafhankelijke meting per sector"
      - "Uitleg in gewone taal, geen juridisch jargon"
      - "Zonder verkooppraatje"
    cta: "Naar EAA-monitor.nl"
    # Metaregel op de productkaart. `metric` verwijst naar data/metrics.yaml en wordt weggelaten zolang die leeg is.
    meta:
      - { k: "last_run", metric: "last_run" }
      - { k: "sectors", v: "5" }
      - { k: "uptime", metric: "uptime" }
    panel: "chart"
    panel_title: "meting_per_sector.csv"
    sectors:
      - { id: "rijksoverheid", name: "Rijksoverheid" }
      - { id: "gemeenten", name: "Gemeenten" }
      - { id: "cultuur", name: "Cultuur" }
      - { id: "e-commerce", name: "E-commerce" }
      - { id: "zorg", name: "Zorg" }
    palette:
      title: "Geldt de toegankelijkheidswet voor mij?"
      keywords: "eaa wcag toegankelijkheid wet european accessibility act"
  - id: "mkb-offerte"
    title: "MKB-offerte.nl"
    kind: "TOOL"
    url: "https://mkb-offerte.nl"
    summary: "Plak de aanvraag van je klant erin. Binnen tien minuten staat er een offerte klaar die je klant online ondertekent."
    intro: "Offertes maken en opvolgen zonder avondklus. Plak de aanvraag erin en binnen tien minuten staat er een voorstel klaar dat je klant direct online ondertekent."
    features:
      - "Offerte in 10 minuten, ook vanaf je telefoon"
      - "Klant ondertekent direct in de browser"
      - "WCAG 2.2 AA — ook met een beperking te gebruiken"
    cta: "Naar MKB-offerte.nl"
    meta:
      - { k: "avg_time", metric: "avg_time" }
      - { k: "e-sign", v: "ja" }
      - { k: "wcag", v: "2.2 AA" }
    panel: "screenshot"
    panel_title: "mkb-offerte.nl/app"
    screenshot: "/images/screenshots/mkb-offerte-hero.png"
    screenshot_alt: "Screenshot van MKB-offerte.nl"
    palette:
      title: "Offerte maken en laten ondertekenen"
      keywords: "offerte tekenen klant ondertekenen voorstel"

