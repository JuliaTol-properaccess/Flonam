{{ define "main" }}
{{- /* Standaardpagina (o.a. privacy): intro + lopende tekst. */ -}}
<div class="container intro">
  <h1 class="h1">{{ .Params.headline | default .Title }}</h1>
  {{- with .Description }}
  <p class="lead">{{ . }}</p>
  {{- end }}
</div>
{{- with .Content }}
<div class="rule-top">
  <div class="container">
    <article class="prose">
      {{ . }}
    </article>
  </div>
</div>
{{- end }}
{{ end }}
